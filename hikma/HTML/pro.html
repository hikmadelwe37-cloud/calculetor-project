<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript API Explorer</title>
    <link rel="stylesheet" href="pro.css">
    
</head>
<body>

    <!-- Step 1: Define the Request First -->
    <div class="request-section">
        <label for="apiUrl">Enter API Request URL:</label>
        <input type="text" id="apiUrl" value="https://api.example.com/student/1" placeholder="https://..." />
    </div>
    
    <!-- Step 2: Choose the Method -->
    <div class="method-section">
        <button onclick="loadWithPromises()">Load with Promises</button>
        <button onclick="loadWithAsyncAwait()">Load with Async/Await</button>
    </div>
    <main class="container">
        <h1>JavaScript API Explorer</h1>
        <p>Learn how JavaScript communicates with a server.</p>

        <section class="panel">
            <h2>1. Choose a request method</h2>

            <button id="promiseButton">Load with Promises</button>
            <button id="asyncButton">Load with Async/Await</button>
            <button id="errorButton" class="error-button">
                Test Error Handling
            </button>
        </section>

        <section class="panel">
            <h2>2. What is happening?</h2>
            <p id="status">Waiting for you to choose a button...</p>
            <p id="steps">Your request has not started yet.</p>
        </section>

        <section class="panel">
            <h2>3. API Response</h2>
            <div id="userResult">
                <p>Your user's information will appear here.</p>
            </div>
        </section>
    </main>
     <script src="rpo.js"></script>
</body>
</htm>
