<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Course Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Hikma Tech Academy</h1>

    <!-- Search Section -->
    <div style="margin-bottom: 20px;">
        <label for="search"><strong>Search Courses:</strong></label><br>
        <input id="search" type="text" placeholder="Search courses">
    </div>

    <ul id="courseList">
        <li>HTML</li>
        <li>CSS</li>
        <li>javaScript</li>
        <li>python</li>
        <li>C++</li>
    </ul>

    <hr style="margin: 30px 0;">

    <!-- Registration Form Section -->
    <h2>Student Registration Form</h2>

    <form class="box">

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter your password"><br><br>

        <label>Age:</label><br>
        <input type="number"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox"> C++
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <br><br>

        <label>Country:</label><br>
        <select>
            <option>Ethiopia</option>
            <option>Somalia</option>
            <option>Kenya</option>
            <option>Djibouti</option>
        </select>
        <br><br>

        <label>About Yourself:</label><br>
        <textarea rows="5" cols="40" placeholder="Tell us about yourself"></textarea>
        <br><br>

        <input type="submit" value="Register">

    </form>

    <!-- JavaScript File -->
    <script src="serch.js"></script>
</body>

</html>
