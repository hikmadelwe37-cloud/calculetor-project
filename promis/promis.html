<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>API User Search</title>
    <link rel="stylesheet" href="promis.css">
    
</head>

<body>

    <h1>User Search App</h1>
    <p>Enter a User ID (1 to 10):</p>

    <input type="number" id="userIdInput" min="1" max="10" value="1">
    <button onclick="fetchUserData()">Search User</button>

    <div class="card" id="userCard">
        <h3>Name: <span id="name">--</span></h3>
        <p>Email: <span id="email">--</span></p>
        <p>City: <span id="city">--</span></p>
    </div>

    <script src="promis.js"></script>
</body>

</html>
