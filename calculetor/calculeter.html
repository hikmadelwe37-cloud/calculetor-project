<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Hub & Calculator</title>
    <link rel="stylesheet" href="calculeter.css">
</head>

<body>

    <div class="container">

        <!-- 1. CALCULATOR CARD -->
        <div class="card">
            <h3>Simple Calculator</h3>
            <label for="num1">Number 1:</label>
            <input type="number" id="num1" placeholder="Enter first number">

            <label for="num2">Number 2:</label>
            <input type="number" id="num2" placeholder="Enter second number">

            <button id="calcBtn">Calculet</button>
            <div id="calcResult" class="output-box">Result will appear here...</div>
        </div>

        <!-- 2. FORM CARD (Name, Email, Message, Uppercase, & History) -->
        <div class="card">
            <h3>Contact & Submission Form</h3>
            <form id="contactForm">
                <label for="nameInput">Name:</label>
                <input type="text" id="nameInput" placeholder="Your name...">

                <label for="emailInput">Email:</label>
                <input type="email" id="emailInput" placeholder="Your email...">

                <label for="msgInput">Message about the Calculator:</label>
                <textarea id="msgInput" rows="3" placeholder="What do you think of the calculator?"></textarea>

                <button type="submit">Submit (Uppercase)</button>
            </form>

            <div id="formResult" class="output-box"></div>

            <!-- Calculator History Tracker Before Submission -->
            <div style="margin-top: 15px;">
                <strong>Calculator History (Saved before submit):</strong>
                <ul id="historyList">
                    <!-- History items added dynamically via createElement -->
                </ul>
            </div>
        </div>

        <!-- 3. DARK MODE TOGGLE AT THE BOTTOM -->
        <div class="card" style="text-align: center;">
            <button id="themeToggle">Dark Mode</button>
        </div>

    </div>
    <script src="calculeter.js"></script>
    </body>
    
    </html>
